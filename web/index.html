<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unnet — settlement reconciliation</title>
<!-- The design system specifies Inter. It is loaded non-render-blocking and the
     stack falls back to the platform UI font, so the dashboard paints instantly
     and works with no network at all — which matters here, because the demo is
     meant to run offline and a finance tool should not block first paint on a
     third-party font server. -->
<!-- Inline so there is no favicon request to 404 on a machine with no network. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Cpath d='M9 10v7a7 7 0 0 0 14 0v-7' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   Tokens lifted from the project's AlignUI Figma library (file
   RaeyCgqanyZuEnfE3YF8ef, "Component and style guide"), read through the Figma
   MCP rather than eyeballed: the neutral ramp, the eight semantic hues with
   their alpha-10/16/24 tints, radius-12, and the Inter / Inter Display pairing.
   The library has no dashboard page, so the layout here is ours; the system is
   theirs.
--------------------------------------------------------------------------- */
:root {
  /* The ramp is inverted against its Figma source: this is a dark console, so
     `gray-0` is the deepest surface and `gray-950` the brightest text. Keeping
     the *names* means every rule written against the light theme keeps meaning
     what it meant — a hairline is still `--stroke-soft`, body copy is still
     `--text-strong` — and the theme is one block rather than a rewrite.

     Dark because of what this screen is. An operator has it open all day next
     to a bank portal, reading columns of figures; a luminous white field is
     the wrong ground for that, and every serious trading and treasury console
     landed on the same answer. */
  --gray-0:#09090b;  --gray-50:#0c0c0f; --gray-100:#141417; --gray-200:#26262b;
  --gray-300:#34343b; --gray-400:#52525b; --gray-500:#8c8c97; --gray-600:#a1a1aa;
  --gray-700:#d4d4d8; --gray-800:#e8e8ea; --gray-950:#fafafa;

  --blue:#476cff;   --blue-a10:#476cff1f;   --blue-a16:#476cff33;
  --green:#1fc16b;  --green-a10:#1fc16b1f;  --green-a16:#1fc16b33;
  --red:#fb3748;    --red-a10:#fb37481f;    --red-a16:#fb374833;
  --orange:#fa7319; --orange-a10:#fa73191f; --orange-a16:#fa731933;
  --yellow:#fbc64b; --yellow-a10:#fbc64b1f;
  --purple:#784def; --purple-a10:#784def1f; --purple-a16:#784def33;
  --teal:#22d3bb;   --teal-a10:#22d3bb1f;
  --slate-a10:#99a0ae1f; --slate-a16:#99a0ae33;

  /* Each hue above is a *fill* — right for a dot, a bar or a solid button, and
     unreadable as text on a near-black ground: #476cff on #141417 measures
     3.4:1. These are the same hues lifted in lightness until they clear 4.5:1
     on the page, on the surface, and on their own 12% tint, so a status badge
     is legible rather than decorative. Hue is untouched. */
  --blue-ink:#8fa6ff; --green-ink:#4ade80; --red-ink:#fb7185;
  --orange-ink:#fbbf24; --purple-ink:#b39dfb; --yellow-ink:#fbc64b;
  --teal-ink:#2dd4bf;

  /* Three text roles, measured on --bg-surface (#141417): 17.4, 8.9 and 5.5:1,
     and re-checked on every ground they actually land on — the page, a raised
     panel, and the tinted group-header row, where the weakest pair is 4.5:1.
     gray-400 is a hairline colour, never a text colour — it measures 2.6:1 and
     a run id is text a reader has to actually read. */
  --text-strong:var(--gray-950); --text-sub:var(--gray-600); --text-soft:var(--gray-500);
  --bg-page:var(--gray-0); --bg-surface:var(--gray-100); --bg-weak:#1b1b1f;
  --stroke-soft:var(--gray-200); --stroke-sub:var(--gray-300);

  --r:12px; --r-sm:8px; --r-pill:999px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  /* On a dark ground a drop shadow reads as grime. Elevation here is a
     one-pixel lighter edge along the top of a surface, which is how a raised
     panel actually catches light. */
  --shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page); color:var(--text-strong); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  letter-spacing:-0.006em;
}
a{color:var(--blue-ink);text-decoration:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--bg-surface);border-right:1px solid var(--stroke-soft);
  padding:20px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--stroke-soft)}
.brand h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.02em}
.brand .tag{color:var(--text-soft);font-size:11.5px;margin-top:4px;line-height:1.4}
nav{padding:12px 12px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:var(--r-sm);
  color:var(--text-sub);font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center}
nav button:hover{background:var(--bg-weak);color:var(--text-strong)}
nav button.on{background:var(--blue-a10);color:var(--blue-ink)}
nav button .ic{width:16px;text-align:center;font-size:13px;opacity:.9}
nav .count{margin-left:auto;font-size:11px;color:var(--text-soft);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--stroke-soft);
  color:var(--text-soft);font-size:11px;font-family:var(--mono);line-height:1.7}
main{padding:28px 32px 72px;max-width:1560px;overflow-x:hidden}

.head{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.head h2{margin:0 0 5px;font-size:24px;font-weight:600;letter-spacing:-0.022em;
  text-wrap:balance}
/* 68ch keeps the intro inside the 60-75 character measure where the eye still
   finds the next line; 80ch was wrapping these at ~95 characters. */
.head p{margin:0;color:var(--text-sub);max-width:68ch;font-size:14px;text-wrap:pretty}
.back{all:unset;cursor:pointer;color:var(--text-sub);font-size:13px;font-weight:500;
  padding:6px 12px;border:1px solid var(--stroke-soft);border-radius:var(--r-sm);background:var(--bg-surface)}
.back:hover{background:var(--bg-weak)}

/* ---------- surfaces ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--bg-surface);border:1px solid var(--stroke-soft);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow)}
.tile .k{color:var(--text-soft);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:26px;font-weight:600;margin-top:7px;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.tile .s{color:var(--text-sub);font-size:12px;margin-top:5px;line-height:1.45}
/* Ink, not fill: #1fc16b on white is 2.36:1, which misses even the 3:1 floor
   large text gets. These are headline figures, not decoration. */
.tile.blue .v{color:var(--blue-ink)} .tile.green .v{color:var(--green-ink)}
.tile.red .v{color:var(--red-ink)}   .tile.orange .v{color:var(--orange-ink)}
.tile.purple .v{color:var(--purple-ink)}

.panel{background:var(--bg-surface);border:1px solid var(--stroke-soft);
  border-radius:var(--r);margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
.panel>h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--stroke-soft);
  font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel>h3 .note{color:var(--text-soft);font-weight:400;font-size:12px}
.panel .body{padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr);gap:18px;align-items:start}
@media (max-width:1180px){.grid2,.grid-detail{grid-template-columns:1fr}
  .shell{grid-template-columns:1fr}.side{display:none}}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-soft);font-weight:500;font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--stroke-soft);
  position:sticky;top:0;background:var(--bg-surface);z-index:1}
td{padding:11px 14px;border-bottom:1px solid var(--stroke-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg-weak)}
/* A row that opens a case is a control, so it has to be reachable and visibly
   focused. `all:unset` on the nav buttons had taken their default ring away
   with it, leaving the whole product keyboard-navigable but invisibly so. */
tbody tr.click:focus-visible{outline:2px solid var(--blue-ink);outline-offset:-2px}
nav button:focus-visible{outline:2px solid var(--blue-ink);outline-offset:-2px}
.back:focus-visible{outline:2px solid var(--blue-ink);outline-offset:1px}
.head h2:focus{outline:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* Settlement ids, UTRs and bank references have no spaces in them, so a narrow
   column has nowhere to break and the text escapes the cell. */
.mono{font-family:var(--mono);font-size:12px;overflow-wrap:break-word}
/* An identifier is a single token to a reader. Give the columns that carry
   one enough room that the layout does not have to break it. */
td.mono{min-width:14ch}
.scroll{max-height:calc(100vh - 300px);min-height:240px;overflow:auto}

/* Badge — Color x Size, mirroring the library's variant structure. */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.45}
.badge.gray{background:var(--slate-a10);color:var(--text-sub)}
.badge.blue{background:var(--blue-a10);color:var(--blue-ink)}
.badge.green{background:var(--green-a10);color:var(--green-ink)}
.badge.red{background:var(--red-a10);color:var(--red-ink)}
.badge.orange{background:var(--orange-a10);color:var(--orange-ink)}
.badge.purple{background:var(--purple-a10);color:var(--purple-ink)}
.badge.lg{font-size:13px;padding:5px 12px;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* Button — Type x Size x State. */
button.btn{cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;
  padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--stroke-sub);
  background:var(--bg-surface);color:var(--text-strong);transition:background .12s,border-color .12s}
button.btn:hover{background:var(--bg-weak)}
button.btn:focus-visible{outline:2px solid var(--blue-ink);outline-offset:1px}
button.btn.primary{background:var(--gray-950);border-color:var(--gray-950);color:var(--gray-0);font-weight:600}
button.btn.primary:hover{background:var(--gray-800)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{background:var(--bg-surface);border:1px solid var(--stroke-sub);color:var(--text-strong);
  border-radius:var(--r-sm);padding:7px 11px;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--blue-ink);outline-offset:1px;border-color:var(--blue-ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters label{color:var(--text-soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}

tr.grouphead > td{background:var(--bg-weak);border-top:1px solid var(--stroke-soft);
  padding-top:11px;padding-bottom:11px;cursor:pointer}
tr.grouphead:focus-visible > td{outline:2px solid var(--blue-ink);outline-offset:-2px}
.bar{height:6px;background:var(--gray-200);border-radius:var(--r-pill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--blue)}
.empty{color:var(--text-soft);padding:36px;text-align:center;font-size:13.5px}
.muted{color:var(--text-sub)} .soft{color:var(--text-soft)}
pre.json{background:var(--bg-weak);border:1px solid var(--stroke-soft);border-radius:var(--r-sm);
  padding:11px;overflow:auto;font-size:11.5px;font-family:var(--mono);color:var(--text-sub);
  margin:8px 0 0;max-height:240px}
details.ev summary{cursor:pointer;color:var(--text-soft);font-size:12px;margin-top:6px}
.callout{border:1px solid var(--stroke-soft);border-left:3px solid var(--blue);background:var(--bg-surface);
  padding:12px 15px;border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--text-sub);font-size:13px;margin-bottom:18px}
.callout b{color:var(--text-strong);font-weight:600}

/* Progress Indicator — Step=01..04 in the library, used for case lifecycle. */
.stepper{display:flex;align-items:center;gap:0;margin:2px 0 4px}
.step{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.step .ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--stroke-sub);
  flex:none;display:grid;place-items:center;font-size:10px;color:var(--text-soft);background:var(--bg-surface)}
.step.done .ring{background:var(--blue);border-color:var(--blue);color:#fff}
.step.now .ring{border-color:var(--blue);color:var(--blue-ink);box-shadow:0 0 0 3px var(--blue-a10)}
.step .lbl{font-size:11.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done .lbl,.step.now .lbl{color:var(--text-strong);font-weight:500}
.step .line{flex:1;height:2px;background:var(--stroke-soft);margin:0 4px;min-width:10px}
.step.done .line{background:var(--blue)}
/* A case routed straight to an external party never passes through
   investigation. Ticking a step it skipped would claim work nobody did. */
.step.skipped .ring{border-style:dashed;color:var(--text-soft)}
.step.skipped .lbl{color:var(--text-soft);text-decoration:line-through;text-decoration-color:var(--stroke-sub)}

/* Agent trace */
.trace{position:relative;padding-left:22px}
.trace::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--stroke-soft)}
.trace .node{position:relative;padding:0 0 16px}
.trace .node:last-child{padding-bottom:0}
.trace .node::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;
  border-radius:50%;background:var(--bg-surface);border:2px solid var(--stroke-sub)}
.trace .node.ok::before{background:var(--green);border-color:var(--green)}
.trace .node.warn::before{background:var(--orange);border-color:var(--orange)}
.trace .node.bad::before{background:var(--red);border-color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px}
.kv dt{color:var(--text-soft)} .kv dd{margin:0;font-weight:500}

/* ---------------------------------------------------------------------------
   Console layer
   Everything below is what separates a page that shows finance data from a
   console someone reads all day: figures that line up, headers that stay put,
   a loading state that holds its shape, and no motion that isn't reporting a
   state change.
--------------------------------------------------------------------------- */

/* Tells the browser to paint form controls, scrollbars and the canvas behind
   the page dark too. Without it the gaps around the app flash white. */
:root{color-scheme:dark}

::selection{background:var(--blue-a16);color:var(--text-strong)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:6px;
  border:3px solid var(--bg-page)}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
*{scrollbar-width:thin;scrollbar-color:var(--gray-300) transparent}

/* One ring, everywhere, and it never disappears — a keyboard operator has to
   be able to see where they are on a screen that moves money. */
:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px;border-radius:3px}

/* Motion here reports a state change and nothing else. An interface that
   animates for pleasure is an interface a finance team stops trusting. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---------- figures ----------
   Every number in the product is tabular and every identifier is monospace.
   Proportional digits make a column of rupee amounts impossible to scan for
   the outlier, which is the single thing an operator is scanning for. */
.tile .v,.kv dd,.num,.mono,td.num,th.num,.count,.badge{font-variant-numeric:tabular-nums}
td.num,th.num{font-family:var(--mono);font-size:12.5px;letter-spacing:-0.01em}

/* ---------- icons ---------- */
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button .ic{opacity:.75}
nav button.on .ic,nav button:hover .ic{opacity:1}

/* ---------- navigation ----------
   The active item carries a bar on its leading edge as well as a tint. Colour
   alone is a weak signal at a glance and no signal at all to a reader who
   cannot separate these hues. */
nav button{position:relative}
nav button.on::before{content:"";position:absolute;left:-8px;top:50%;
  transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;
  background:var(--blue-ink)}
nav button{transition:background 120ms ease,color 120ms ease}

.brand h1{display:flex;align-items:center;gap:9px}
.brand h1 .mark{width:22px;height:22px;border-radius:6px;background:var(--text-strong);
  color:var(--bg-page);display:grid;place-items:center;font-size:13px;font-weight:700;
  flex:none;letter-spacing:0}

/* ---------- tables ----------
   The header stays visible while the body scrolls. Losing the column labels
   two hundred rows into a ledger is how a figure gets read into the wrong
   column. */
.scroll{position:relative}
.scroll thead th{position:sticky;top:0;z-index:2;background:var(--bg-surface);
  box-shadow:inset 0 -1px 0 var(--stroke-soft)}
tbody tr{transition:background 90ms ease}
tbody tr.click:hover{background:var(--bg-weak)}
tbody tr.grouphead{background:var(--bg-weak)}
tbody tr.grouphead:hover{background:var(--gray-200)}

/* ---------- loading ----------
   A skeleton keeps the layout at the size it will be, so the page does not
   jump when the data lands. On a free-tier instance waking from sleep this is
   the first thing a reviewer sees, and "Loading…" on an empty page reads as
   broken. */
@keyframes shimmer{0%{opacity:.45}50%{opacity:.8}100%{opacity:.45}}
.skel{display:block;height:11px;border-radius:4px;background:var(--gray-200);
  animation:shimmer 1.4s ease-in-out infinite}
.skel.w40{width:40%} .skel.w60{width:60%} .skel.w25{width:25%}
@media (prefers-reduced-motion:reduce){.skel{animation:none;opacity:.6}}

/* ---------- states ---------- */
.empty{color:var(--text-sub);padding:44px 24px;text-align:center;font-size:13.5px}
.empty strong{display:block;color:var(--text-strong);font-size:15px;font-weight:600;
  margin-bottom:6px;letter-spacing:-0.015em}
.empty code{font-family:var(--mono);font-size:12px;background:var(--bg-weak);
  border:1px solid var(--stroke-soft);border-radius:5px;padding:2px 6px;color:var(--text-strong)}

/* A failure is a notice with a shape, not red text in the flow of the page. */
.notice{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;
  border:1px solid var(--stroke-soft);border-left:3px solid var(--text-soft);
  border-radius:var(--r-sm);background:var(--bg-surface);font-size:13px;
  color:var(--text-sub);margin:0 0 14px}
.notice .ic{margin-top:1px}
.notice b{color:var(--text-strong);font-weight:600}
.notice.bad{border-left-color:var(--red);background:var(--red-a10);color:var(--text-strong)}
.notice.warn{border-left-color:var(--orange);background:var(--orange-a10);color:var(--text-strong)}
.notice.good{border-left-color:var(--green);background:var(--green-a10);color:var(--text-strong)}

/* ---------- density ----------
   Uppercase micro-labels for anything that names a field rather than carrying
   a value. It keeps the label out of the way of the number, which is what the
   eye is here for. */
.lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-soft)}

/* ---------- who decided ----------
   Three of the seventeen hundred audit rows were decided by a model. A badge
   in the fifth column is invisible while scrolling; a coloured leading edge is
   not, and it is the question a reviewer is actually scanning this table for.
   The badge stays — the edge is a second, redundant encoding, not a
   replacement, so the meaning does not rest on colour alone. */
tbody tr.by-model > td:first-child{box-shadow:inset 3px 0 0 var(--purple)}
tbody tr.by-human > td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
</style>
</head>
<body>
<!-- Icon sprite. Drawn on a 24px grid at 1.5px stroke with round caps and
     joins, matching the Keyline house style; inlined rather than fetched
     because the dashboard has to render with no network at all, and a finance
     console should not blank its navigation because a CDN is slow. Each glyph
     is decorative — every control it sits in also carries its own text — so
     they are all aria-hidden at the point of use. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-overview" viewBox="0 0 24 24">
    <rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/>
    <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>
  </symbol>
  <symbol id="i-cases" viewBox="0 0 24 24">
    <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l1.8 2.2h8A2.5 2.5 0 0 1 21 9.7v7.8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
  </symbol>
  <symbol id="i-runs" viewBox="0 0 24 24">

<script>
const VIEWS = [
  ["overview",  "i-overview",  "Overview"],
  ["cases",     "i-cases",     "Cases"],
  ["runs",      "i-runs",      "Runs"],
  ["unnetting", "i-unnetting", "Un-netting"],
  ["matches",   "i-matches",   "Matches"],
  ["audit",     "i-audit",     "Audit"],
  ["ask",       "i-ask",       "Ask"],
];

const S = { view:"overview", caseKey:null, summary:null, waterfall:null, batch:0, cache:{},
            token:(() => { try { return sessionStorage.getItem("unnet_token") || ""; }
                           catch { return ""; } })() };

class ApiError extends Error {
  constructor(status, detail) {
    super(detail || `Request failed (${status})`);
    this.status = status;
  }
}

// `fetch` resolves for 404 and 500, and FastAPI answers both with valid JSON,
// so a helper that only calls .json() never rejects. Every catch block in this
// file was therefore dead: a view would take the error body, dereference a
// field it does not have, and either blank the page or print a raw
// TypeError at the operator. Turning a non-2xx into a throw is what makes the
// error handling that is already written actually run.
const api = async (p, o) => {
  let response;
  try {
    response = await fetch(p, o);
  } catch (err) {
    throw new ApiError(0, "Could not reach the server. Check the connection and retry.");
  }
  let body = null;
  try { body = await response.json(); } catch { /* an error page with no JSON */ }
  if (!response.ok) {
    const detail = body && body.detail;
    throw new ApiError(response.status,
      typeof detail === "string" ? detail : null);
  }
  return body;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function inr(paise, o={}) {
  const neg = paise < 0, abs = Math.abs(Math.round(paise));
  const whole = Math.floor(abs/100), frac = String(abs%100).padStart(2,"0");
  let d = String(whole), out;
  if (d.length > 3) {
    let head = d.slice(0,-3); const tail = d.slice(-3); const g = [];
    while (head.length > 2) { g.unshift(head.slice(-2)); head = head.slice(0,-2); }
    if (head) g.unshift(head);
    out = g.join(",") + "," + tail;
  } else out = d;
  return `${neg?"−":(o.signed?"+":"")}₹${out}${o.noPaise?"":"."+frac}`;
}
const pct = n => (n*100).toFixed(1)+"%";
const day = t => t ? String(t).slice(0,10) : "\u2014";
const ageText = d => d < 1 ? "today" : Math.round(d) + " days";
// Matches printed "4,740 links" over 150 rows and Audit "5,166 entries" over
// 400. In a reconciliation tool, misstating how much of the ledger is on
// screen is its own kind of wrong number.
const shownOf = (shown, total, noun) => shown < total
  ? `<span class="soft">showing ${num(shown)} of ${num(total)} ${noun}</span>`
  : `<span class="soft">${num(total)} ${noun}</span>`;
const num = n => Number(n ?? 0).toLocaleString("en-IN");

const STATUSES = [
  ["detected","Detected"],["investigating","Investigating"],
  ["routed","Routed"],["awaiting_action","Awaiting action"],["resolved","Resolved"],
];
const STATUS_LABEL = Object.fromEntries(STATUSES);
const STATUS_TONE = {detected:"gray",investigating:"purple",routed:"blue",
                     awaiting_action:"orange",resolved:"green"};
const PRIO_TONE = {P1:"red",P2:"orange",P3:"gray"};
// What each verdict permitted. The distinction the whole design rests on is
// that only the first of these is allowed to touch the books.
const AI_OUTCOME = {
  resolved_verified: "Closed. Every component read back from a ledger row.",
  hypothesis: "Quarantined for a human. Sums, but rests on something unevidenced.",
  abstained: "Nothing proposed. Left open for a human.",
  not_attempted: "No model available; left to the rules.",
};
const aiOutcome = v => AI_OUTCOME[v]
  || (v && v.startsWith("rejected") ? "Refused. Arithmetic or citation failed." : "—");
const IMPACTS = {
  claimable:["Claimable","blue","A counterparty owes this back."],
  at_risk:["At risk","orange","Real money, whereabouts unresolved."],
  contestable_loss:["Lost unless contested","red","Gone unless someone disputes it."],
  bookkeeping:["Bookkeeping","gray","No money moves; the books are wrong."],
};
const VERDICT = {
  resolved_verified:["VERIFIED","green","Every component was read back from a ledger row."],
  hypothesis:["HYPOTHESIS","purple","Sums exactly, but rests on something in no record. A human decides."],
  abstained:["ABSTAINED","gray","The model declined to guess."],
  not_attempted:["NOT ATTEMPTED","gray","No model was available."],
};
const verdictOf = v => VERDICT[v] || (v ? ["REJECTED","red","Arithmetic or citation failed."] : null);

const badge = (t,tone,dot) => `<span class="badge ${tone}">${dot?'<i class="dot"></i>':""}${esc(t)}</span>`;
const statusBadge = s => badge(STATUS_LABEL[s]||s, STATUS_TONE[s]||"gray", true);

function stepper(status, visited) {
  // `visited` is the set of states the case's own history records. A step
  // before the current one that never appears there was skipped, not
  // completed — most cases go straight from detection to an owner, and
  // showing a tick against "Investigating" would credit work nobody did.
  const seen = new Set(visited || []);
  const flow = STATUSES.filter(([k]) => k !== "detected" || status === "detected");
  const at = flow.findIndex(([k]) => k === status);
  return `<div class="stepper">` + flow.map(([k,label],i) => {
    const cls = i === at ? "now" : i < at ? (seen.has(k) ? "done" : "skipped") : "";
    const mark = i === at ? i+1 : i < at ? (seen.has(k) ? "✓" : "–") : i+1;
    return `<div class="step ${cls}"><div class="ring">${mark}</div>
      <div class="lbl">${esc(label)}</div>${i<flow.length-1?'<div class="line"></div>':""}</div>`;
  }).join("") + `</div>`;
}

// ---------- Overview ----------
async function viewOverview() {
  const s = S.summary, r = s.run;
  const c = await api("/api/cases");
  const sm = c.summary;
  const runs = (await api("/api/runs")).items;
  const latest = runs[0] || {};
  const records = r.orders_count + r.settlement_lines_count + r.bank_txns_count;

  let h = `<div class="head"><div>
    <h2>Overview</h2>
    <p>What the latest run found, and what is still outstanding after it. Money here is
       <b>identified</b>, never recovered.</p></div></div>`;

  h += `<div class="tiles">
    <div class="tile green"><div class="k">Reconciled</div>
      <div class="v">${inr(r.value_reconciled_paise,{noPaise:1})}</div>
      <div class="s">${pct(r.gross_paise ? r.value_reconciled_paise/r.gross_paise : 0)} of ${inr(r.gross_paise,{noPaise:1})} gross</div></div>
    <div class="tile"><div class="k">Records</div><div class="v">${num(records)}</div>
      <div class="s">${num(r.matched_count)} linked in ${num(r.duration_ms)} ms</div></div>
    <div class="tile ${sm.open_cases?"orange":"green"}"><div class="k">Open cases</div>
      <div class="v">${num(sm.open_cases)}</div>
      <div class="s">${num(sm.resolved_cases)} settled · oldest ${sm.oldest_open_days}d</div></div>
    <div class="tile red"><div class="k">Needs attention</div>
      <div class="v">${num((sm.by_priority||{}).P1||0)}</div><div class="s">P1 by value or age</div></div>
    <div class="tile purple"><div class="k">Model calls</div><div class="v">${num(r.llm_calls)}</div>
      <div class="s">${r.llm_degraded?"degraded to rules":"within budget"}</div></div>
  </div>`;

  h += `<div class="grid2">`;
  h += `<div class="panel"><h3>Where the money sits <span class="note">never summed</span></h3>
        <div class="body"><table><tbody>`;
  for (const [k,[label,tone,blurb]] of Object.entries(IMPACTS)) {
    const v = sm.by_impact[k] || {count:0,paise:0};
    h += `<tr><td style="width:44%">${badge(label,tone)}<div class="soft" style="font-size:11.5px;margin-top:4px">${esc(blurb)}</div></td>
          <td class="num muted">${v.count}</td>
          <td class="num" style="font-weight:600">${inr(v.paise,{noPaise:1})}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;

  const ages = sm.by_ageing || {}; const maxAge = Math.max(...Object.values(ages), 1);
  h += `<div class="panel"><h3>How long it has been open <span class="note">open cases</span></h3>
        <div class="body"><table><tbody>`;
  for (const b of ["today","1-3d","3-7d","7-14d","14d+"]) {
    const n = ages[b] || 0;
    h += `<tr><td style="width:22%">${esc(b)}</td><td class="num muted" style="width:14%">${n}</td>
          <td><div class="bar"><i style="width:${(n/maxAge*100).toFixed(1)}%;background:${
            b==="14d+"?"var(--red)":b==="7-14d"?"var(--orange)":"var(--blue)"}"></i></div></td></tr>`;
  }
  h += `</tbody></table></div></div></div>`;

  h += `<div class="panel"><h3>Work on these first
        <span class="note">by priority, then value</span></h3>
        <div class="body" style="padding:0"><table><thead><tr>
          <th>Priority</th><th>Issue</th><th class="num">Amount</th><th>Owner</th><th>Status</th><th>Age</th>
        </tr></thead><tbody>`;
  for (const item of c.items.slice(0,6)) {
    h += `<tr class="click" tabindex="0" role="link" data-case="${esc(item.case_key)}">
      <td>${badge(item.priority, PRIO_TONE[item.priority]||"gray")}</td>
      <td><div style="font-weight:500">${esc(item.action)}</div>
          <div class="soft"><span class="mono">${esc(item.subject_id)}</span> · ${esc(item.code)}</div></td>
      <td class="num" style="font-weight:600">${esc(item.amount_display)}</td>
      <td class="muted">${esc(item.owner)}</td>
      <td>${statusBadge(item.status)}</td>
      <td class="muted">${item.age_days < 1 ? "today" : item.age_days.toFixed(0)+"d"}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;

  h += `<div class="panel"><h3>Latest run <span class="note">${esc(latest.run_id||"")}</span></h3>
    <div class="body"><dl class="kv">
      <dt>Records linked</dt><dd>${pct(latest.coverage||0)} <span class="soft">(${num(latest.linked_records)} of ${num(latest.records)})</span></dd>
      <dt>Breaks raised</dt><dd>${num(latest.exceptions_open)} ${
        latest.exceptions_delta!=null?`<span class="soft">(${latest.exceptions_delta>=0?"+":""}${latest.exceptions_delta} vs previous)</span>`:""}</dd>
      <dt>Open cases</dt><dd>${num(latest.open_cases)} <span class="soft">(${
        num(latest.resolved_cases)} settled, so not raised again)</span></dd>
      <dt>Duration</dt><dd>${num(latest.duration_ms)} ms</dd>
    </dl></div></div>`;
  return h;
}

// ---------- Cases ----------
async function viewCases() {
  const q = S.cache.caseQ || {};
  const params = new URLSearchParams();
  for (const k of ["owner","impact","status"]) if (q[k]) params.set(k,q[k]);
  const d = await api("/api/cases?"+params);
  const sm = d.summary;
  const needle = (q.text||"").toLowerCase();
  const items = needle
    ? d.items.filter(i => (i.code+i.subject_id+i.owner+i.action).toLowerCase().includes(needle))
    : d.items;

  let h = `<div class="head"><div>
    <h2>Cases</h2>
    <p>Every break the run could not close, routed to whoever can fix it and tracked by an
       identity that survives across runs.</p></div></div>`;

  h += `<div class="filters">
    <input id="cText" placeholder="Search id, code, owner…" value="${esc(q.text||"")}" style="width:250px">
    <label>Owner</label><select id="cOwner"><option value="">all</option>`;
  for (const [o,v] of Object.entries(sm.by_owner).sort((a,b)=>b[1].paise-a[1].paise))
    h += `<option value="${esc(o)}" ${q.owner===o?"selected":""}>${esc(o)} (${v.count})</option>`;
  h += `</select><label>Status</label><select id="cStatus"><option value="">open</option>`;
  for (const [k,label] of STATUSES)
    h += `<option value="${k}" ${q.status===k?"selected":""}>${esc(label)}</option>`;
  h += `</select><label>Impact</label><select id="cImpact"><option value="">all</option>`;
  for (const k of Object.keys(IMPACTS))
    h += `<option value="${k}" ${q.impact===k?"selected":""}>${IMPACTS[k][0]}</option>`;
  // `items` is what survived the client-side search over what the server sent;
  // `c.total` is what actually matched the filters. When the server capped the
  // page, say so rather than letting a slice pass for the queue.
  h += `</select><span class="soft">${num(items.length)} shown</span>`;
  if (d.total > d.items.length)
    h += `<span class="soft"> · server returned ${num(d.items.length)} of ${num(d.total)} matching</span>`;
  h += `<span class="soft"> · ${num(sm.open_cases)} open</span></div>`;

  h += `<div class="panel"><div class="scroll"><table><thead><tr>
    <th>Priority</th><th>Case</th><th class="num">Amount</th><th>Ageing</th>
    <th></th><th>Status</th><th>Age</th><th></th></tr></thead><tbody>`;

  // 130 rows is not 130 pieces of work. Grouped by who owns them and what is
  // wrong, they are eleven conversations: one chase with Razorpay risk covering
  // 41 held payments, one ledger correction covering 16 duplicates. A flat list
  // makes an operator rediscover that every morning.
  const groups = [];
  const byKey = new Map();
  for (const i of items) {
    const key = i.owner + "|" + i.code;
    let g = byKey.get(key);
    if (!g) { g = {owner:i.owner, code:i.code, action:i.action, rows:[], paise:0}; byKey.set(key,g); groups.push(g); }
    g.rows.push(i);
    g.paise += i.amount_paise || 0;
  }
  const rank = {P1:0, P2:1, P3:2};
  groups.sort((a,b) => (rank[a.rows[0].priority] ?? 9) - (rank[b.rows[0].priority] ?? 9) || b.paise - a.paise);

  for (const g of groups) {
    const collapsed = S.cache.closedGroups && S.cache.closedGroups[g.owner+"|"+g.code];
    h += `<tr class="grouphead" data-group="${esc(g.owner+"|"+g.code)}" tabindex="0">
      <td colspan="3"><span class="soft" style="margin-right:8px">${collapsed?"▸":"▾"}</span>
        <b>${esc(g.owner)}</b> <span class="soft">·</span> <span class="mono">${esc(g.code)}</span></td>
      <td colspan="3" class="muted">${esc(g.action)}</td>
      <td colspan="2" class="num"><b>${esc(inr(g.paise))}</b>
        <span class="soft"> · ${num(g.rows.length)} case${g.rows.length===1?"":"s"}</span></td></tr>`;
    if (collapsed) continue;
    for (const i of g.rows) {
      h += `<tr class="click" tabindex="0" role="link" data-case="${esc(i.case_key)}">
        <td>${badge(i.priority, PRIO_TONE[i.priority]||"gray")}</td>
        <td class="mono">${esc(i.subject_id)}${i.hypothesis?`<div>${badge("hypothesis","purple")}</div>`:""}</td>
        <td class="num" style="font-weight:600">${esc(i.amount_display)}</td>
        <td class="soft">${esc(i.ageing_bucket || "")}</td>
        <td></td>
        <td>${statusBadge(i.status)}</td>
        <td class="muted">${i.age_days<1?"today":i.age_days.toFixed(0)+"d"}</td>
        <td class="soft">›</td></tr>`;
    }
  }
  if (!items.length)
    h += `<tr><td colspan="8"><div class="empty">${
      (q.owner||q.impact||q.status||q.text)
        ? "No cases match these filters."
        : "Nothing outstanding here."}</div></td></tr>`;
  h += `</tbody></table></div>`;
  if (groups.length)
    h += `<div class="body" style="border-top:1px solid var(--stroke-soft)">
      <span class="soft">${num(items.length)} cases, ${num(groups.length)}
      conversation${groups.length===1?"":"s"} — one counterparty and one problem each.</span></div>`;
  h += `</div>`;
  return h;
}

// ---------- Case detail ----------
async function viewCase() {
  const d = await api(`/api/cases/${S.caseKey}`);
  const c = d.case;
  const v = verdictOf(d.verdict);
  const [impactLabel, impactTone] = IMPACTS[c.impact] || ["—","gray"];

  let h = `<div class="head"><div>
      <h2>${esc(c.action)}</h2>
      <p class="mono">${esc(c.code)} · ${esc(c.subject_id)}</p>
    </div><button class="back" id="backCases">← All cases</button></div>`;

  h += `<div class="tiles">
    <div class="tile red"><div class="k">Discrepancy</div><div class="v">${esc(c.amount_display)}</div>
      <div class="s">${esc(impactLabel)}</div></div>
    <div class="tile"><div class="k">Owner</div><div class="v" style="font-size:19px">${esc(c.owner)}</div>
      <div class="s">${
        c.status==="awaiting_action" ? "waiting on them"
        // An external owner with an open hypothesis is not yet theirs to act
        // on: "ours to action" beside an owner of "bank" reads as a
        // contradiction when the real state is that we owe them a confirmed ask.
        : c.status==="investigating" ? "confirm before asking"
        : c.status==="resolved" ? "settled"
        : "ours to action"}</div></div>
    <div class="tile"><div class="k">Priority</div><div class="v" style="font-size:19px">${esc(c.priority)}</div>
      <div class="s">outstanding ${ageText(c.age_days)}</div></div>
    <div class="tile"><div class="k">Status</div><div class="v" style="font-size:19px">${esc(STATUS_LABEL[c.status]||c.status)}</div>
      <div class="s">first seen run ${esc((c.first_seen_run||"").slice(0,8))}</div></div>
  </div>`;

  const visited = [c.status].concat(
    (d.history||[]).flatMap(e => [e.from_status, e.to_status])).filter(Boolean);
  h += `<div class="panel"><div class="body">${stepper(c.status, visited)}
      <div class="soft" style="margin-top:14px;font-size:12px">
        Dated <b>${day(c.occurred_at)}</b> · reconciled as of <b>${day(c.as_of)}</b>
        · first flagged ${day(c.first_seen_at)}, run ${esc((c.first_seen_run||"").slice(0,8))}
      </div></div></div>`;

  h += `<div class="grid-detail"><div>`;

  h += `<div class="panel"><h3>What is wrong</h3><div class="body">
        <p style="margin:0 0 12px">${esc(d.summary || c.message)}</p>
        <div class="callout" style="margin:0"><b>Ask:</b> ${esc(c.message)}</div></div></div>`;

  h += `<div class="panel"><h3>Evidence <span class="note">the records behind it</span></h3>
        <div class="body" style="padding:0"><table><thead><tr>
        <th>Record</th><th>Reference</th><th class="num">Amount</th><th>Detail</th></tr></thead><tbody>`;
  for (const e of d.evidence) {
    h += `<tr><td style="font-weight:500">${esc(e.kind)}</td>
      <td class="mono">${esc(e.id)}<div class="soft">${esc((e.at||"").toString().slice(0,10))}</div></td>
      <td class="num">${esc(e.amount_display)}</td>
      <td class="muted" style="max-width:340px">${esc(e.detail)}</td></tr>`;
  }
  if (!d.evidence.length) h += `<tr><td colspan="4"><div class="empty">No linked records.</div></td></tr>`;
  h += `</tbody></table></div></div>`;

  if (d.agent_trace.length || c.hypothesis) {
    h += `<div class="panel"><h3>What Unnet tried
      <span class="note">${d.agent_trace.length} step${d.agent_trace.length===1?"":"s"}</span></h3><div class="body">`;
    if (v) h += `<div style="margin-bottom:14px">${badge(v[0], v[1])}
                 <span class="soft" style="margin-left:8px">${esc(v[2])}</span></div>`;
    h += `<div class="trace">`;
    for (const t of d.agent_trace) {
      const tone = t.verdict === "resolved_verified" ? "ok"
                 : t.verdict === "hypothesis" ? "warn"
                 : (t.verdict||"").startsWith("rejected") ? "bad" : "";
      h += `<div class="node ${tone}">
        <div style="font-weight:500">Step ${t.step} · ${esc(t.action)}</div>`;
      if (t.components) h += `<div class="mono soft" style="margin-top:3px">${
        t.components.map(x=>esc(x)).join("  +  ")}</div>`;
      if (t.verdict) h += `<div style="margin-top:5px">${badge(t.verdict.replace(/_/g," "),
        tone==="ok"?"green":tone==="warn"?"purple":"red")}${
        t.delta_paise ? `<span class="soft" style="margin-left:8px">out by ${inr(t.delta_paise,{signed:1})}</span>`:""}</div>`;
      // The step's reason is stored truncated; when the full text is already
      // below as the verdict reason, printing both just says it twice.
      const dup = t.reason && d.verdict_reason
        && d.verdict_reason.startsWith(t.reason.replace(/…$/, "").trim());
      if (t.reason && !dup) h += `<div class="muted" style="margin-top:4px">${esc(t.reason)}</div>`;
      if (t.model) h += `<div class="mono soft" style="margin-top:5px;font-size:11px">${esc(t.model)}</div>`;
      h += `</div>`;
    }
    h += `</div>`;
    if (d.verdict_reason)
      h += `<div class="callout" style="border-left-color:var(--purple);margin:14px 0 0">${esc(d.verdict_reason)}</div>`;
    h += `</div></div>`;
  }

  h += `</div><div>`;

  h += `<div class="panel"><h3>Next action</h3><div class="body">
      <dl class="kv" style="margin:0 0 14px">
        <dt>Owner</dt><dd>${esc(c.owner)}</dd>
        <dt>Impact</dt><dd>${badge(impactLabel, impactTone)}</dd>
        <dt>Age</dt><dd>${ageText(c.age_days)}</dd>
      </dl>
      <div class="soft" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Draft message</div>
      <pre class="json" id="draft" style="white-space:pre-wrap;max-height:none">${esc(c.message)}</pre>
      ${c.status==="resolved" ? "" : `
        <div class="soft" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px">What did you do?</div>
        <input id="settleNote" placeholder="e.g. raised with HDFC, ref 88231"
               style="width:100%" value="">`}
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap">
        <button class="btn" id="copyDraft">Copy</button>
        ${c.status==="resolved"
          ? badge("Resolved","green")
          : `<button class="btn primary" id="settle">Mark settled</button>`}
        <span id="settleMsg" class="soft"></span>
      </div>
      <div id="tokenRow" ${S.token ? "" : "hidden"} style="margin-top:12px">
        <div class="soft" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">
          Operator token</div>
        <input id="adminToken" type="password" placeholder="UNNET_ADMIN_TOKEN"
               style="width:100%" value="${esc(S.token || "")}">
        <div class="soft" style="margin-top:6px;font-size:11.5px">
          Held for this browser tab only — never written to disk, never sent anywhere
          but this API.</div>
      </div></div></div>`;

  h += `<div class="panel"><h3>History</h3><div class="body"><div class="trace">`;
  for (const e of d.history) {
    h += `<div class="node"><div style="font-weight:500">${esc(e.kind.replace(/_/g," "))}
      <span class="badge gray" style="margin-left:6px">${esc(e.actor)}</span></div>`;
    if (e.from_status || e.to_status)
      h += `<div class="soft" style="margin-top:3px">${esc(STATUS_LABEL[e.from_status]||e.from_status||"—")} → ${esc(STATUS_LABEL[e.to_status]||e.to_status||"—")}</div>`;
    if (e.note) h += `<div class="muted" style="margin-top:3px">${esc(e.note)}</div>`;
    h += `<div class="soft mono" style="margin-top:3px">${esc((e.at||"").toString().replace("T"," ").slice(0,16))}</div></div>`;
  }
  h += `</div></div></div>`;

  h += `</div></div>`;
  return h;
}

async function viewRuns() {
  const d = await api("/api/runs?limit=100");
  let h = `<div class="head"><div><h2>Runs</h2>
    <p>Change over time — whether the match rate is holding and whether the queue is
       draining. Breaks are what the engine raised; open cases are what is still
       outstanding after anything a human settled.</p></div></div>`;

  h += `<div class="panel"><div class="scroll"><table><thead><tr>
    <th>Run</th><th class="num">Records</th><th class="num">Records linked</th>
    <th class="num">Breaks raised</th><th class="num">Open cases</th><th class="num">Settled</th>
    <th class="num">In exceptions</th><th class="num">Duration</th><th>Model</th>
    </tr></thead><tbody>`;
  // A real zero is not the same as no comparison: the oldest run has nothing
  // to compare against, every other run genuinely moved by nothing.
  const delta = (v,invert) => v==null ? `<span class="soft">—</span>`
    : v===0 ? `<span class="soft">no change</span>`
    : `<span style="color:${(invert?v<0:v>0)?"var(--green-ink)":"var(--red-ink)"}">${v>0?"+":""}${num(v)}</span>`;
  for (const r of d.items) {
    h += `<tr>
      <td class="mono">${esc(r.run_id.slice(0,10))}<div class="soft">${esc((r.started_at||"").toString().replace("T"," ").slice(0,16))}</div></td>
      <td class="num">${num(r.records)}</td>
      <td class="num" style="font-weight:600">${pct(r.coverage)}<div class="soft" style="font-weight:400">${num(r.linked_records)} linked</div></td>
      <td class="num">${num(r.exceptions_open)}<div>${delta(r.exceptions_delta,true)}</div></td>
      <td class="num">${num(r.open_cases)}</td>
      <td class="num">${num(r.resolved_cases)}</td>
      <td class="num">${inr(r.value_in_exceptions_paise,{noPaise:1})}</td>
      <td class="num">${num(r.duration_ms)} ms</td>
      <td>${r.llm_degraded?badge("degraded","red"):r.llm_calls?badge(r.llm_calls+" calls","purple"):badge("rules only","gray")}</td>
    </tr>`;
  }
  if (!d.items.length)
    h += `<tr><td colspan="9"><div class="empty">No reconciliation has run yet.</div></td></tr>`;
  h += `</tbody></table></div></div>`;
  if (!d.items.length) return h;
  h += `<div class="callout">The same break produces the same case identity every run, so a
        case settled by a human is not raised again — which is why breaks can hold at ${
        num(d.items[0]?.exceptions_open ?? 0)} while open cases fall. Ageing runs from the date the
        money moved to the date the run reconciles to, not from when Unnet first looked.</div>`;
  return h;
}

// ---------- Un-netting (waterfall) ----------
function waterfallSVG(steps) {
  const W=940,H=330,PADL=78,PADR=14,PADB=74,PADT=26,n=steps.length;
  const plotW=W-PADL-PADR, bw=Math.max(22,Math.min(66,plotW/n-16));
  const gap = n>1 ? (plotW-bw*n)/(n-1) : 0;
  let run=0; const bars=[];
  for (const s of steps) {
    if (s.kind==="start"||s.kind==="total") { bars.push({...s,from:null,to:s.delta_paise}); run=s.delta_paise; }
    else { bars.push({...s,from:run,to:run+s.delta_paise}); run+=s.delta_paise; }
  }
  const levels=bars.flatMap(b=>b.from==null?[b.to]:[b.from,b.to]);
  let lo=Math.min(...levels),hi=Math.max(...levels);
  const span=hi-lo||Math.abs(hi)||1; lo-=span*.18; hi+=span*.12;
  const y=v=>PADT+(H-PADT-PADB)*(1-(v-lo)/(hi-lo));
  const color={start:"#476cff",total:"#476cff",fee:"#fa7319",reversal:"#fb3748",
               adjustment:"#784def",transfer:"#784def",residual:"#fb3748"};
  let out=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Payout un-netting waterfall">`;
  for (let i=0;i<=4;i++){const v=lo+(hi-lo)*(i/4),gy=y(v);
    out+=`<line x1="${PADL-6}" y1="${gy}" x2="${W-PADR}" y2="${gy}" stroke="#ebebeb"/>`;
    out+=`<text x="${PADL-11}" y="${gy+3.5}" text-anchor="end" fill="#a3a3a3" font-size="10" font-family="ui-monospace,monospace">${esc(inr(v,{noPaise:1}))}</text>`;}
  bars.forEach((b,i)=>{
    const x=PADL+i*(bw+gap), isTotal=b.from==null;
    const top=isTotal?y(b.to):y(Math.max(b.from,b.to));
    const bot=isTotal?y(lo):y(Math.min(b.from,b.to));
    const hgt=Math.max(2.5,bot-top), c=color[b.kind]||"#7b7b7b";
    out+=`<rect x="${x}" y="${top}" width="${bw}" height="${hgt}" rx="3" fill="${c}" opacity="${isTotal?.95:.85}"/>`;
    if(i<bars.length-1){const ny=y(b.to);
      out+=`<line x1="${x+(isTotal?bw:0)}" y1="${ny}" x2="${x+bw+gap}" y2="${ny}" stroke="#d1d1d1" stroke-dasharray="2 3"/>`;}
    out+=`<text x="${x+bw/2}" y="${top-7}" text-anchor="middle" fill="#171717" font-size="10.5" font-family="ui-monospace,monospace">${esc(inr(b.delta_paise,{noPaise:1}))}</text>`;
    out+=`<text x="${x+bw/2}" y="${H-PADB+20}" text-anchor="end" fill="#5c5c5c" font-size="10.5" transform="rotate(-34 ${x+bw/2} ${H-PADB+20})">${esc(b.label)}</text>`;});
  out+=`<text x="${W-PADR}" y="${H-6}" text-anchor="end" fill="#a3a3a3" font-size="9.5">axis starts at ${esc(inr(lo,{noPaise:1}))}, not zero — otherwise the deductions are invisible</text></svg>`;
  return out;
}

async function viewAudit() {
  const q = S.cache.auditQ || {};
  const params = new URLSearchParams({limit:"400"});
  for (const k of ["stage","decided_by"]) if (q[k]) params.set(k,q[k]);
  const d = await api("/api/audit?"+params);
  // The model's decisions are the ones a reviewer came here to check, and there
  // are three of them among seventeen hundred rule rows. Filtering to find them
  // requires already knowing they exist, so they get their own panel first —
  // the same audit rows, not a second source of truth.
  const ai = (await api("/api/audit?decided_by=model&limit=50")).items;

  let h = `<div class="head"><div><h2>Audit trail</h2>
    <p>Append-only. Every decision, in the order it was made, with who decided and what the
       verifier said. Model decisions carry a prompt hash so the exact input is recoverable.</p></div></div>`;

  h += `<div class="panel"><h3>What the model decided this run
      <span class="note">${ai.length} of ${num(d.total)} decisions</span></h3>
    <div class="body" style="padding:0"><table><thead><tr>
      <th>Subject</th><th>Decision</th><th>Verifier</th><th>Outcome</th><th>Model · prompt</th>
    </tr></thead><tbody>`;
  for (const a of ai) {

    h += `<tr><td class="mono">${esc(a.subject_id)}</td>

  h += `</tbody></table></div>
    <div class="body" style="border-top:1px solid var(--stroke-soft)">
      <span class="soft">Every row above is one entry in the table below, shown here because
      finding three model decisions among ${num(d.total)} requires already knowing they are there.

      to do about it.</span></div></div>`;

    h += `<option value="${s}" ${q.stage===s?"selected":""}>${s}</option>`;
  h += `</select><label>By</label><select id="aBy"><option value="">all</option>
    <option value="rule" ${q.decided_by==="rule"?"selected":""}>rule</option>
    <option value="model" ${q.decided_by==="model"?"selected":""}>model</option>
    <option value="human" ${q.decided_by==="human"?"selected":""}>human</option>
    </select>${shownOf(d.items.length, d.total, "entries")}</div>`;
  h += `<div class="panel"><div class="scroll"><table><thead><tr>
    <th class="num">#</th><th>Stage</th><th>Subject</th><th>Decision</th><th>By</th><th>Decider</th><th>Verifier</th>
    </tr></thead><tbody>`;
  for (const a of d.items) {
    h += `<tr class="by-${esc(a.decided_by)}"><td class="num soft">${a.seq}</td><td class="mono">${esc(a.stage)}</td>
      <td class="mono">${esc(a.subject_id)}</td><td>${esc(a.decision)}</td>
      <td>${badge(a.decided_by, a.decided_by==="model"?"purple":a.decided_by==="human"?"orange":"blue")}</td>
      <td class="mono soft" style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${esc(a.decider_ref)}</td>
      <td class="mono">${esc(a.verifier_result||"—")}</td></tr>`;
  }
  if (!d.items.length)
    h += `<tr><td colspan="7"><div class="empty">Nothing recorded for these filters.</div></td></tr>`;
  h += `</tbody></table></div></div>`;
  return h;
}

// ---------- wiring ----------
const RENDER = {overview:viewOverview, cases:viewCases, case:viewCase, runs:viewRuns,
                unnetting:viewUnnetting, matches:viewMatches, audit:viewAudit, ask:viewAsk};

function bind() {
  const on=(id,ev,fn)=>{const n=document.getElementById(id); if(n) n.addEventListener(ev,fn);};

  document.querySelectorAll("[data-group]").forEach(el => {
    const toggle = () => {
      S.cache.closedGroups = S.cache.closedGroups || {};
      const key = el.getAttribute("data-group");
      S.cache.closedGroups[key] = !S.cache.closedGroups[key];
      render();
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });
  document.querySelectorAll("[data-case]").forEach(el => {
    const open = () => { S.caseKey = el.getAttribute("data-case"); S.view="case"; render(true); };
    el.addEventListener("click", open);
    // Enter and Space are what a keyboard user presses on something that looks
    // like a link or a button; without this the queue is mouse-only.
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
  });
  on("backCases","click",()=>{S.view="cases";S.caseKey=null;render(true);});

  const cq=()=>{S.cache.caseQ={
    owner:document.getElementById("cOwner").value,
    impact:document.getElementById("cImpact").value,
    status:document.getElementById("cStatus").value,
    text:document.getElementById("cText").value.trim()};render();};
  ["cOwner","cImpact","cStatus"].forEach(i=>on(i,"change",cq));
  on("cText","keydown",e=>{if(e.key==="Enter")cq();});

  on("batchSel","change",e=>{S.batch=+e.target.value;render();});

  const mq=()=>{S.cache.matchQ={tier:document.getElementById("fTier").value,
    decided_by:document.getElementById("fDecider").value,
    q:document.getElementById("fQ").value.trim()};render();};
  ["fTier","fDecider"].forEach(i=>on(i,"change",mq));
  on("fQ","keydown",e=>{if(e.key==="Enter")mq();});

  const aq=()=>{S.cache.auditQ={stage:document.getElementById("aStage").value,
    decided_by:document.getElementById("aBy").value};render();};
  ["aStage","aBy"].forEach(i=>on(i,"change",aq));

  on("copyDraft","click",async()=>{
    await navigator.clipboard?.writeText(document.getElementById("draft").innerText);
    const b=document.getElementById("copyDraft"); b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1400);
  });
  on("settle","click",async()=>{
    const b=document.getElementById("settle");
    const msg=document.getElementById("settleMsg");
    const tokenRow=document.getElementById("tokenRow");
    const tokenInput=document.getElementById("adminToken");
    // Replace the message each time. Appending it, as this did, meant a second
    // failed click left two contradictory explanations side by side.
    const say = t => { if (msg) msg.textContent = t; };

    b.disabled=true; b.textContent="Settling…"; say("");
    const note=(document.getElementById("settleNote")||{}).value || "";
    const headers={"Content-Type":"application/json"};
    // A deployment with UNNET_ADMIN_TOKEN set refuses every write without this
    // header. The dashboard used to send none at all, so on any secured
    // deployment "Mark settled" could not succeed — the one action the whole
    // loop depends on.
    if (S.token) headers["Authorization"] = `Bearer ${S.token}`;

    let r;
    try {
      r = await fetch(`/api/cases/${S.caseKey}/resolve`, {
        method:"POST", headers,
        body: JSON.stringify({note: note.trim() || "Settled from the dashboard"}),
      });
    } catch {
      b.disabled=false; b.textContent="Mark settled";
      say("Could not reach the server."); return;
    }

    if (r.status === 401) {
      b.disabled=false; b.textContent="Mark settled";
      if (tokenRow) tokenRow.hidden = false;
      say(S.token ? "That token was not accepted." : "This deployment requires an operator token.");
      if (tokenInput) tokenInput.focus();
      return;
    }
    if (r.status === 503) {
      b.disabled=false; b.textContent="Mark settled";
      say("This deployment is read-only: no operator token is configured on the server.");
      return;
    }
    if (!r.ok) {
      b.disabled=false; b.textContent="Mark settled";
      say(`Settle failed (${r.status}).`); return;
    }
    // The button that had focus no longer exists after the re-render.
    render(true);
  });
  // Remember the token for this tab only. sessionStorage dies with the tab and
  // never touches disk; a finance operator should not have a bearer token
  // sitting in localStorage on a shared machine.
  on("adminToken","input",e=>{
    S.token = e.target.value.trim();
    try { sessionStorage.setItem("unnet_token", S.token); } catch {}
  });

  const ask=async text=>{
    S.cache.lastQ=text; const box=document.getElementById("qBox"); if(box)box.value=text;
    document.getElementById("qOut").innerHTML=`<div class="empty">Thinking…</div>`;
    const a=await api("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:text})});
    document.getElementById("qOut").innerHTML=renderAnswer(a);
  };
  on("qGo","click",()=>ask(document.getElementById("qBox").value));
  on("qBox","keydown",e=>{if(e.key==="Enter")ask(e.target.value);});
  document.querySelectorAll("[data-sug]").forEach(b=>b.addEventListener("click",()=>ask(b.getAttribute("data-sug"))));
}

async function render(moveFocus) {
  const openCount = S.cache.openCases;
  document.getElementById("nav").innerHTML = VIEWS.map(([k,ic,label])=>
    `<button data-v="${k}" class="${S.view===k||(k==="cases"&&S.view==="case")?"on":""}"${
       S.view===k||(k==="cases"&&S.view==="case")?' aria-current="page"':""}>
       <svg class="ic" aria-hidden="true"><use href="#${ic}"/></svg>${label}${
       k==="cases"&&openCount!=null?`<span class="count">${openCount}</span>`:""}</button>`).join("");
  document.querySelectorAll("[data-v]").forEach(b=>
    b.addEventListener("click",()=>{S.view=b.getAttribute("data-v");S.caseKey=null;render(true);}));

  const main=document.getElementById("main");
  try { main.innerHTML = await RENDER[S.view](); bind(); }
  catch(err){
    main.innerHTML = `<div class="empty">This view could not load.<br>
      <span class="soft">${esc(err.message || err)}</span><br>
      <button class="btn" style="margin-top:12px" id="retryView">Retry</button></div>`;
    const retry = document.getElementById("retryView");
    if (retry) retry.addEventListener("click", () => render());
  }

  // Swapping innerHTML leaves a screen reader parked where the old view was.
  // Moving focus to the new heading is the standard fix and also gives a
  // keyboard user a sensible place to carry on tabbing from.
  const heading = main.querySelector(".head h2");
  if (heading && moveFocus) { heading.tabIndex = -1; heading.focus(); }
}

(async function boot(){
  try { S.summary = await api("/api/summary"); }
  catch (err) {
    // A 404 genuinely means no reconciliation has been run. A 500, a timeout
    // or a dropped connection means something is wrong, and telling an
    // operator to run `make recon` in that case sends them somewhere useless.
    document.getElementById("main").innerHTML = err.status === 404
      ? `<div class="empty">No reconciliation has run yet. Run
           <span class="mono">make recon</span>, then reload.</div>`
      : `<div class="empty">${esc(err.message)}<br>
           <button class="btn" style="margin-top:12px"
             onclick="location.reload()">Retry</button></div>`;
    return;
  }
  try { S.cache.openCases = (await api("/api/cases")).summary.open_cases; } catch {}
  const r=S.summary.run;
  let ready = null;
  try { ready = await api("/api/ready"); } catch (err) { /* 503 carries a dict */ }
  document.getElementById("foot").innerHTML =
    `run ${esc(r.run_id.slice(0,10))}<br>${num(r.orders_count)} orders<br>${num(r.settlement_lines_count)} lines<br>${num(r.bank_txns_count)} bank rows`
    // An operator settling cases is entitled to know before they start that
    // this instance forgets. Silence here would be the dishonest option.
    + (ready && ready.storage_durable === false
        ? `<div style="margin-top:8px;color:var(--orange-ink)">Demo instance:
             settled cases reset when it restarts.</div>` : "");
  render();
})();
</script>
</body>
</html>
